<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>중부산동심 재무관리</title>
<link rel="icon" type="image/png" sizes="64x64" href="/assets/icon-finance-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-finance-180.png">
<link rel="manifest" href="/finance.webmanifest">
<meta name="theme-color" content="#1D63D6">
<meta name="apple-mobile-web-app-title" content="재무관리">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f6fa;--card:#fff;--navy:#1f3a5f;--blue:#2d63c8;--ink:#17212b;--mut:#66768a;--line:#e3e8ef;--soft:#eef2f7;--ok:#2f7a5f;--okbg:#e6f4ee;--warn:#9a6200;--warnbg:#fff3dc;--bad:#b42318;--badbg:#fdecea;--r:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
.topin{display:flex;align-items:center;gap:14px;height:68px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(160deg,#2c5aa0,#1f3a5f);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.3px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#c5cfdb}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:#28497a}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:#fff;border-color:#f2b8b5;color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select.in,input.in,textarea.in{border:1px solid var(--line);border-radius:11px;padding:8px 11px;background:#fff;min-width:0}
textarea.in{width:100%;min-height:70px}
.in:focus{outline:2px solid #bcd0f3;border-color:#9db7e6}
.hero{padding:26px 0 8px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{color:var(--blue);font-weight:700;letter-spacing:2.5px;font-size:12px}
.hero h1{margin:6px 0 4px;font-size:32px;letter-spacing:-.8px}
.hero p{margin:0;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px}
.pill.g{background:var(--okbg);color:var(--ok)}.pill.y{background:var(--warnbg);color:var(--warn)}.pill.r{background:var(--badbg);color:var(--bad)}.pill.b{background:#e8effc;color:var(--blue)}.pill.n{background:var(--soft);color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
nav.tabs{background:#e7edf5;border-radius:16px;padding:6px;display:flex;gap:4px;overflow-x:auto;margin:14px 0 18px}
nav.tabs button{border:0;background:transparent;padding:10px 16px;border-radius:12px;font-weight:700;color:#4f6075;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(20,40,70,.08)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.card h2{margin:0 0 4px;font-size:17px;letter-spacing:-.3px}
.card .sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.chead{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.kpi .lb{color:var(--mut);font-weight:600;font-size:13px}
.kpi .v{font-size:25px;font-weight:800;margin:8px 0 2px;letter-spacing:-.6px}
.kpi .s{color:var(--mut);font-size:12.5px}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:#b9c8dc}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{background:#f6f8fb;color:#4f6075;font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:middle;white-space:nowrap;word-break:keep-all}
table.t td.wrap{white-space:normal;min-width:180px}
table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:#f7faff}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:800;background:#fafbfd}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:620px}
.tw table.t th:first-child{border-top-left-radius:14px}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-n{background:var(--soft);color:#55657a}.b-b{background:#e8effc;color:var(--blue)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px}.f label{font-weight:700;font-size:13px;color:#3b4a5c}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fg>*{min-width:0}.f .in{width:100%;min-width:0}.fg.pay{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.muted{color:var(--mut)}.small{font-size:12.5px}.neg{color:var(--bad)}.pos{color:var(--ok)}.b{font-weight:700}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef1f5}
.list .it:last-child{border:0}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.modal{background:#fff;border-radius:20px;width:min(1100px,100%);padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.sm{width:min(560px,100%)}.modal.md{width:min(780px,100%)}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mh h3{margin:0;font-size:19px}
.toast{position:fixed;right:22px;bottom:22px;background:#17212b;color:#fff;padding:12px 16px;border-radius:12px;z-index:90;display:none;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.loading{position:fixed;inset:0;background:rgba(243,246,250,.75);display:none;place-items:center;z-index:80;font-weight:700;color:var(--navy)}
.spin{width:34px;height:34px;border:4px solid #c9d6ea;border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:#f6f8fb;border:1px dashed #cfd8e3;border-radius:12px;padding:10px 12px;color:#4f6075;font-size:13px}
.warnbox{background:var(--badbg);border:1px solid #f4c7c3;color:#8a1c12;border-radius:12px;padding:10px 12px;font-size:13px}
.okbox{background:var(--okbg);border:1px solid #bfe3d2;color:#1f5e47;border-radius:12px;padding:10px 12px;font-size:13px}
.seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px}.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:700;color:#55657a;cursor:pointer}.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.chartbox{position:relative;height:280px}
footer{color:var(--mut);font-size:12.5px;padding:24px 0 40px}
.pill{white-space:nowrap}
.logo{flex:none}.show-m{display:none}
.grid>*{min-width:0}
html,body{max-width:100%;overflow-x:hidden}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2,.g21{grid-template-columns:1fr}.fg{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.wrap{padding:0 14px}.topin{gap:8px;height:60px}.brand{font-size:15px;white-space:nowrap}.logo{width:34px;height:34px;font-size:16px;border-radius:9px}#modeBadge{padding:4px 9px;font-size:11.5px}.topin .btn{padding:6px 10px;font-size:13px}.card{padding:16px}.modal{padding:16px}.hero{padding-top:16px}.hero h1{font-size:25px}.g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:19px}.brand{font-size:16px}.fg{grid-template-columns:1fr}.hide-m{display:none}.show-m{display:inline}.mh{flex-wrap:wrap}.mh h3{width:100%;font-size:17px}.mh .sp{display:none}}
@media print{header.top,nav.tabs,.noprint,footer{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#ddd}.tw{max-height:none;overflow:visible}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin">
  <div class="logo">동</div><div class="brand">중부산동심 재무관리</div>
  <div class="sp"></div>
  <select id="bizSel" class="in hide-m" title="사업자"><option>전체</option><option>중부산동심</option><option>부산아이랑</option></select>
  <span id="modeBadge" class="pill n">-</span>
  <button class="btn" onclick="saveExcel()" title="매출관리표 엑셀로 저장"><span class="hide-m">엑셀로 저장</span><span class="show-m">⤓</span></button>
  <button class="btn" onclick="reload()" title="새로고침"><span class="hide-m">새로고침</span><span class="show-m">↻</span></button>
</div></header>

<div class="wrap">
  <div class="hero">
    <div style="flex:1;min-width:260px"><div class="eyebrow">BUSINESS FINANCE</div><h1 id="pgTitle">현황</h1><p id="pgSub">매출·입금·미수·계산서를 한 화면에서 확인하세요.</p></div>
    <span class="pill g"><span class="dot"></span>구글 드라이브에 자동 저장</span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <footer>데이터는 구글 드라이브의 '중부산동심 재무 DB' 시트에 저장되어 PC·휴대폰 어디서 열어도 같습니다. 계산서는 볼타를 통해 국세청으로 전송됩니다. <span id="ftInfo"></span></footer>
</div>

<div class="modal-bg" id="mbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="mdl"></div></div>
<div class="toast" id="toast"></div>
<div id="login" style="position:fixed;inset:0;background:var(--bg);z-index:95;display:none;place-items:center;padding:20px"><div class="card" style="width:min(400px,100%);text-align:center;padding:34px 28px"><div class="logo" style="margin:0 auto 14px;width:56px;height:56px;font-size:26px;border-radius:15px">동</div><div class="eyebrow">BUSINESS FINANCE</div><h2 style="margin:8px 0 4px;font-size:22px">중부산동심 재무관리</h2><div class="muted small" style="margin-bottom:18px">비밀번호를 넣어 주세요. 이 기기에서는 30일 동안 로그인이 유지됩니다.</div><input class="in" id="lgPin" type="password" inputmode="numeric" placeholder="비밀번호" style="width:100%;text-align:center;font-size:18px;letter-spacing:4px" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn pri" id="lgBtn" style="width:100%;margin-top:12px;padding:11px" onclick="doLogin()">로그인</button><div id="lgMsg" class="small" style="color:var(--bad);margin-top:10px;min-height:18px"></div></div></div>
<div class="loading" id="loading"><div><div class="spin"></div><div id="loadMsg">불러오는 중…</div></div></div>

<script>
/* ================= 기본 ================= */
const TABS=[['home','현황','매출·입금·미수·계산서를 한 화면에서 확인하세요.'],['work','입금·계산서','입금을 확인하고 클릭 한 번으로 계산서를 발행합니다.'],['centers','원별 관리','원별 결제완료·미수금·선납을 정리하고 바로 처리합니다.'],['sales','매출 내역','월별 매출 줄을 조회하고 추가·수량 변경·반품을 처리합니다.'],['inv','계산서','발행한 계산서와 국세청 승인 상태를 확인합니다.'],['ana','분석','기간·품목·지역·담당자별 분석 자료를 만들고 내보냅니다.'],['pl','손익','월별 손익을 근거와 함께 기록하고 기간별로 비교합니다.'],['plan','전망·활동','사업 전망·시나리오와 교육·홍보 활동, 신규 기회를 관리합니다.'],['set','설정','발행 모드와 기본 정보를 관리합니다.']];
let TAB='home', BIZ='전체', D=null, S={sales:[],cust:{},inv:[],pay:[],rec:[]}, CHARTS=[], SALE_FILTER={}, INV_FILTER={}, CEN_FILTER={q:'',st:'미수',sort:'bal'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const won=n=>(Math.round(Number(n)||0)).toLocaleString('ko-KR');
const wonS=n=>{n=Number(n)||0;const a=Math.abs(n);return (n<0?'-':'')+(a>=1e8?(a/1e8).toFixed(2)+'억':a>=1e4?Math.round(a/1e4).toLocaleString('ko-KR')+'만':won(a))+'원'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(String(v==null?'':v).replace(/[,\s원]/g,''));return isFinite(n)?n:0};
const toast=(m,ms)=>{const t=$('#toast');t.innerHTML=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms||3500)};
const busy=(on,m)=>{$('#loading').style.display=on?'grid':'none';if(m)$('#loadMsg').textContent=m};
let TOKEN=localStorage.getItem('dsToken')||'';
const API_URL='https://script.google.com/macros/s/AKfycbwq1-_9bvb61GuvykgNAmlkoft6BWZLnDxhIg-JsmCbGVPu3c9pT5r6a6kRSPHjvX3x/exec';
const HAS_GAS=!!(window.google&&google.script&&google.script.run);
async function apiFetch(fn,args){let r;try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})}catch(e){throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하세요.')}const j=await r.json();if(!j.ok){if(String(j.error).includes('AUTH')){showLogin();throw new Error('로그인이 필요합니다')}throw new Error(j.error)}const d=j.data;try{return typeof d==='string'&&/^[\[{]/.test(d)?JSON.parse(d):d}catch(e){return d}}
function api(fn,...a){if(fn==='refreshPending')fn='refreshPendingUi';const args=fn==='login'?a:[TOKEN,...a];if(!HAS_GAS)return apiFetch(fn,args);return new Promise((ok,no)=>google.script.run.withSuccessHandler(r=>{try{ok(typeof r==='string'&&/^[\[{]/.test(r)?JSON.parse(r):r)}catch(e){ok(r)}}).withFailureHandler(e=>{if(String(e&&e.message||e).includes('AUTH')){showLogin();no(new Error('로그인이 필요합니다'))}else no(e)})[fn](...args))}
function showLogin(msg){busy(false);$('#login').style.display='grid';$('#lgMsg').textContent=msg||'';setTimeout(()=>$('#lgPin').focus(),50)}
async function doLogin(){const pin=$('#lgPin').value.trim();if(!pin)return;$('#lgBtn').disabled=true;try{TOKEN=await api('login',pin,navigator.userAgent.slice(0,60));localStorage.setItem('dsToken',TOKEN);$('#login').style.display='none';$('#lgPin').value='';reload()}catch(e){$('#lgMsg').textContent=e.message||e}finally{$('#lgBtn').disabled=false}}
async function doLogout(){try{await api('logout')}catch(e){}localStorage.removeItem('dsToken');TOKEN='';showLogin('로그아웃했습니다.')}
async function call(fn,args,msg){busy(true,msg||'저장 중…');try{return await api(fn,...(args||[]))}catch(e){if(!/로그인이 필요/.test(e.message))alert('오류: '+(e&&e.message||e));throw e}finally{busy(false)}}
const toObj=(cols,r)=>{const o={};cols.forEach((c,i)=>o[c]=r[i]);return o};
const TODAY=()=>D.today, CM=()=>D.today.slice(0,7);
const mLabel=m=>m==='전년미수'?'전년 미수':m==='월미정'?'월 미지정':(/^\d{4}-\d{2}$/.test(m)?(+m.slice(5))+'월'+(m.slice(0,4)!==CM().slice(0,4)?'('+m.slice(2,4)+')':''):m);
const isDue=m=>m==='전년미수'||m==='월미정'||m<=CM();
const isCard=s=>/카드/.test(s['결재형태']||'');
const mOrder=m=>m==='전년미수'?'0000':m==='월미정'?'9999':m;

/* ================= 로딩 ================= */
async function reload(silent){
  if(!silent)busy(true,'불러오는 중…');
  try{
    D=await api('getBootstrap');
    const c=D.cols;
    S.sales=D.sales.map(r=>toObj(c.sales,r)).map(fixSale);
    S.cust={};D.customers.forEach(r=>{const o=toObj(c.customers,r);if(o['원'])S.cust[o['원']]=o});
    S.inv=D.invoices.map(r=>toObj(c.invoices,r)).map(fixInv);
    S.pay=D.payments.map(r=>toObj(c.payments,r));
    S.rec=(D.records||[]).map(r=>({ID:r[0],종류:r[1],기준:String(r[2]),내용:safeJ(r[3]),수정:r[4]}));
    const md=D.settings['발행모드']==='실발행';
    $('#modeBadge').className='pill '+(md?'r':'y');$('#modeBadge').innerHTML='<span class="dot"></span>'+(md?'실발행 모드':'테스트 모드');
    $('#ftInfo').textContent='불러온 시각 '+D.now;
    render();
  }catch(e){if(!/로그인이 필요/.test(e.message))alert('불러오기 실패: '+(e.message||e))}finally{busy(false)}
}
const safeJ=s=>{try{return JSON.parse(s||'{}')}catch(e){return{}}};
function fixSale(s){['수량','단가','공급가','결제금액','3세·만1세','4세·만2세','5세·1단계','6세·2단계','7세·3단계'].forEach(k=>s[k]=num(s[k]));s['월분']=String(s['월분']||'');s['결제일']=String(s['결제일']||'').slice(0,10);return s}
function fixInv(v){['공급가','세액','합계'].forEach(k=>v[k]=num(v[k]));v['작성일']=String(v['작성일']||'').slice(0,10);return v}
function patchSales(rows){rows.forEach(r=>{const o=fixSale(toObj(D.cols.sales,r));const i=S.sales.findIndex(x=>x.ID===o.ID);if(i>=0)S.sales[i]=o;else S.sales.push(o)})}
function patchPays(rows){rows.forEach(r=>{const o=toObj(D.cols.payments,r);const i=S.pay.findIndex(x=>x.ID===o.ID);if(i>=0)S.pay[i]=o;else S.pay.push(o)})}

/* ================= 계산 ================= */
const act=()=>S.sales.filter(s=>s['상태']!=='삭제'&&(BIZ==='전체'||s['사업자']===BIZ));
const realInv=()=>S.inv.filter(v=>v['모드']!=='테스트'&&!/실패/.test(v['상태'])&&(BIZ==='전체'||v['공급자']===BIZ));
function centerStats(){
  const m={};
  act().forEach(s=>{const n=s['원'];if(!n)return;const o=m[n]||(m[n]={name:n,biz:new Set(),mgr:s['담당'],pay:s['결재형태'],sup:0,paid:0,due:0,dueSup:0,future:0,futPaid:0,last:'',lines:0,card:0});
    o.biz.add(s['사업자']);o.lines++;if(isCard(s))o.card++;if(s['담당'])o.mgr=s['담당'];if(s['결재형태'])o.pay=s['결재형태'];
    if(isDue(s['월분'])){o.dueSup+=s['공급가'];o.paid+=s['결제금액'];o.due+=s['공급가']-s['결제금액']}else{o.future+=s['공급가'];o.futPaid+=s['결제금액']}
    if(s['결제일']&&s['결제일']>o.last)o.last=s['결제일'];});
  return Object.values(m).map(o=>{o.net=o.due-o.futPaid;o.st=o.net>0?'미수':o.net<0?'선납':'완납';o.bizs=[...o.biz].join(', ');return o});
}
function monthStats(rows){const m={};(rows||act()).forEach(s=>{const k=s['월분'];const o=m[k]||(m[k]={m:k,sup:0,paid:0,n:0});o.sup+=s['공급가'];o.paid+=s['결제금액'];o.n++});return Object.values(m).sort((a,b)=>mOrder(a.m)<mOrder(b.m)?-1:1)}
function cashByMonth(){const m={};act().forEach(s=>{if(s['결제일']&&s['결제금액']){const k=s['결제일'].slice(0,7);m[k]=(m[k]||0)+s['결제금액']}});return m}
function invByCenterDate(){const m={};realInv().forEach(v=>{const k=v['원']+'|'+v['작성일']+'|'+v['공급자'];m[k]=(m[k]||0)+v['합계']});return m}
/** 계산서 대기 목록: 입금 건마다 같은 원·사업자의 계산서와 맞춰 봄 (영수: 입금일 ~ +3일, 청구: 입금일 40일 전 ~ +3일) */
function pendingQueue(){
  const start=D.settings['발행관리시작일']||'2026-11-25', groups=[], allocated=new Set();
  const addDays=(d,n)=>{const t=new Date(d+'T00:00:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};
  S.pay.forEach(p=>{if(String(p['메모']).startsWith('[취소]'))return;safeArr(p['배정']).forEach(a=>allocated.add(a.id))});
  const byId=Object.fromEntries(S.sales.map(s=>[s.ID,s]));
  S.pay.forEach(p=>{
    if(String(p['메모']).startsWith('[취소]')||String(p['입금일']).slice(0,10)<start||/카드/.test(p['방법']))return;
    const al=safeArr(p['배정']).map(a=>({s:byId[a.id],amt:num(a.amt)})).filter(x=>x.s);
    [...new Set(al.map(x=>x.s['사업자']))].forEach(b=>{const part=al.filter(x=>x.s['사업자']===b);groups.push({kind:'입금기록',pid:p.ID,center:p['원'],date:String(p['입금일']).slice(0,10),biz:b,amt:part.reduce((a,x)=>a+x.amt,0),alloc:part,linked:!!p['계산서ID']})});
  });
  const g={};
  S.sales.forEach(s=>{if(s['상태']==='삭제'||!s['결제일']||s['결제일']<start||!s['결제금액']||isCard(s)||allocated.has(s.ID))return;const k=s['원']+'|'+s['결제일']+'|'+s['사업자'];(g[k]||(g[k]=[])).push(s)});
  Object.entries(g).forEach(([k,rows])=>{const [c,d,b]=k.split('|');groups.push({kind:'매출관리표',center:c,date:d,biz:b,amt:rows.reduce((a,s)=>a+s['결제금액'],0),alloc:rows.map(s=>({s,amt:s['결제금액']})),linked:rows.every(s=>s['계산서ID'])})});
  const pool={};
  S.inv.forEach(v=>{if(v['모드']==='테스트'||/실패/.test(v['상태']))return;const k=(String(v['사업자번호']||'').replace(/\D/g,'')||v['원']||v['상호'])+'|'+v['공급자'];(pool[k]||(pool[k]=[])).push({d:v['작성일'],left:v['합계']})});
  Object.values(pool).forEach(a=>a.sort((x,y)=>x.d<y.d?-1:1));
  const out=[];
  groups.sort((a,b)=>a.date<b.date?-1:1).forEach(gp=>{
    const cu=S.cust[gp.center]||{}, claim=/청구/.test(cu[gp.biz==='부산아이랑'?'영수청구_아이랑':'영수청구_동심']||'');
    const from=claim?addDays(gp.date,-40):gp.date, to=addDays(gp.date,3);
    let need=gp.amt;
    (pool[(String(cu['사업자번호']||'').replace(/\D/g,'')||gp.center)+'|'+gp.biz]||[]).forEach(iv=>{if(need<=0||iv.left<=0||iv.d<from||iv.d>to)return;const u=Math.min(iv.left,need);iv.left-=u;need-=u});
    gp.done=gp.amt-need;
    if(need>10&&!gp.linked&&(BIZ==='전체'||gp.biz===BIZ))out.push(gp);
  });
  return out.sort((a,b)=>a.date<b.date?1:-1);
}
const safeArr=s=>{try{const a=JSON.parse(s||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}};

function allocate(center,months,amt){
  const rows=S.sales.filter(s=>s['원']===center&&s['상태']!=='삭제'&&months.includes(s['월분'])).sort((a,b)=>mOrder(a['월분'])<mOrder(b['월분'])?-1:mOrder(a['월분'])>mOrder(b['월분'])?1:0);
  let left=amt;const al=[];
  rows.forEach(s=>{const bal=s['공급가']-s['결제금액'];if(bal<=0||left<=0)return;const a=Math.min(bal,left);al.push({id:s.ID,amt:a});left-=a});
  if(left>0&&rows.length){if(al.length)al[al.length-1].amt+=left;else al.push({id:rows[rows.length-1].ID,amt:left});}
  return al;
}
function payAllocShow(){
  const c=$('#pC').value.trim(), amt=num($('#pA').value), months=$$('.pm').filter(x=>x.checked).map(x=>x.value), box=$('#allocBox');
  if(!amt){box.innerHTML='<div class="note">입금액을 넣으면 어느 줄에 들어가는지 보여 드립니다.</div>';return}

function adjSum(){const t=$$('.aAge').reduce((a,e)=>a+num(e.value),0);if(t){$('#aQ').value=t;$('#aA').value=fmtIn(t*num($('#aU').value))}}
async function doAdj(id,type){
  const ages={};$$('.aAge').forEach(e=>{if(num(e.value))ages[e.dataset.a]=num(e.value)});
  const p={id,type,ages,qty:num($('#aQ').value),unit:num($('#aU').value),amount:num($('#aA').value),date:$('#aD').value,memo:$('#aM').value,amendInvoiceId:$('#aInv')?$('#aInv').value:''};
  if(!p.qty)return alert('수량을 넣어 주세요.');
  if(p.amendInvoiceId&&D.settings['발행모드']==='실발행'&&!confirm('계산서 공급가액을 -'+won(p.amount)+'원 수정발행해 국세청에 보냅니다. 진행할까요?'))return;
  const r=await call('adjustQty',[p]);patchSales(r.rows);
  const s=S.sales.find(x=>x.ID===id);
  toast(type+' 저장 완료'+(r.amend?(r.amend.ok?' · 수정발행 접수':' · 수정발행 실패: '+esc(r.amend.error)):''),5000);
  if(r.amend)reload(true);
  openCenter(s['원']);
}

  const P=ready?{rev:B.rev*(1+pr('rev')/100),cogs:B.cogs*(1+pr('cogs')/100),labor:B.labor*(1+pr('labor')/100),opex:B.opex*(1+pr('opex')/100)}:null;
  const opt=(arr,v)=>arr.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('');
  $('#view').innerHTML=`
  <section class="grid g2">
   <article class="card"><h2>사업 전망과 대응 계획</h2><div class="sub">전망, 매출 전환, 근거와 담당 메모를 함께 남기세요.</div>
    <div class="fg" style="grid-template-columns:1fr 1fr"><div class="f"><label>검토 연도</label><select class="in" id="pnY">${opt(['2025','2026','2027','2028','2029','2030'],CM().slice(0,4))}</select></div><div class="f"><label>다음 검토일</label><input class="in" type="date" id="pnN"></div>
    <div class="f"><label>동심 본사 매출 전망</label><select class="in" id="pnH">${opt(['선택 대기','감소 예상','전환 진행','유지·확대','자료 확인 필요'])}</select></div><div class="f"><label>타사 매출 전환 상태</label><select class="in" id="pnO">${opt(['선택 대기','검토 중','계약 완료','전환 진행 중','전환 완료'])}</select></div></div>
    <div class="f" style="margin-top:10px"><label>전환 금액·기준 근거 메모</label><textarea class="in" id="pnB" placeholder="예: 적용 시점, 계약·발주 근거, 본사 매출 대체 기준"></textarea></div>
    <div class="f" style="margin-top:10px"><label>사업 전망</label><textarea class="in" id="pnV" placeholder="확인된 시장·계약·매출 전망을 기록하세요."></textarea></div>
    <div class="f" style="margin-top:10px"><label>대응 계획 및 담당 메모</label><textarea class="in" id="pnP" placeholder="실행할 대응, 담당자, 일정, 필요한 확인 자료"></textarea></div>
    <label class="row small" style="margin-top:8px"><input type="checkbox" id="pnC"> 근거 자료 확인 완료</label>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="savePlan()">전망 저장</button></div></article>
   <article class="card"><div class="chead"><div style="flex:1"><h2>예상 시나리오</h2><div class="sub">기준연도 손익과 변화율을 넣으면 영업이익을 계산합니다. 실제 전망 수치로 저장하지 않습니다.</div></div><span class="pill n">가정값 입력</span></div>
    <div class="fg" style="grid-template-columns:1fr 1fr"><div class="f"><label>기준연도</label><select class="in" onchange="SC.base=this.value;render()">${opt(['2025','2026','2027'],SC.base)}</select></div>
    ${[['rev','매출 변화율 (%)'],['cogs','매출원가 변화율 (%)'],['labor','인건비 변화율 (%)'],['opex','운영비 변화율 (%)']].map(([k,l])=>`<div class="f"><label>${l}</label><input class="in" placeholder="가정 입력" value="${esc(SC[k])}" onchange="SC['${k}']=this.value;render()"></div>`).join('')}</div>
    <div class="note" style="margin-top:12px">${baseY.length?`${SC.base}년 손익 입력 ${baseY.length}개월: 매출 ${won(B.rev)} · 원가 ${won(B.cogs)} · 인건비 ${won(B.labor)} · 운영비 ${won(B.opex)} → 영업이익 ${won(B.rev-B.cogs-B.labor-B.opex)}원`:`${SC.base}년 손익이 아직 입력되지 않았습니다. 손익 탭에서 월별 수치를 넣어 주세요.${sales?' (참고: 매출관리표 '+SC.base+'년 매출 '+won(sales)+'원)':''}`}</div>
    ${P?`<div class="grid g2" style="margin-top:12px"><div class="card kpi" style="padding:12px 14px"><div class="lb">예상 매출</div><div class="v" style="font-size:20px">${won(P.rev)}</div></div><div class="card kpi" style="padding:12px 14px"><div class="lb">예상 영업이익</div><div class="v" style="font-size:20px">${won(P.rev-P.cogs-P.labor-P.opex)}</div><div class="s">기준 대비 ${won((P.rev-P.cogs-P.labor-P.opex)-(B.rev-B.cogs-B.labor-B.opex))}원</div></div></div>`:''}
    <div class="small muted" style="margin-top:8px">시나리오는 계획용 가정입니다. 실제 수치와 구분해 검토하세요.</div></article>
  </section>
  <section class="card" style="margin-top:16px"><h2>저장된 사업 전망</h2>${plans.length?plans.map(p=>{const c=p['내용'];return `<div class="list"><div class="it"><span class="badge b-b">${esc(p['기준'])}</span><div style="flex:1"><b>${esc(c.hq)}</b> · 타사 ${esc(c.other)}${c.ok?' <span class="badge b-ok">근거 확인</span>':''}<div class="small muted">${esc(c.vision||'')}</div><div class="small">${esc(c.plan||'')}</div><div class="small muted">${esc(c.basis||'')} ${c.next?'· 다음 검토 '+c.next:''}</div></div><button class="btn sm red" onclick="delRec('${p.ID}')">삭제</button></div></div>`}).join(''):'<div class="empty">아직 저장된 사업 전망이 없습니다.</div>'}</section>
  <section class="grid g21" style="margin-top:16px">
   <article class="card"><h2>교육·홍보와 신규 기회</h2><div class="sub">원장님 대상 활동과 사업 기회를 기록하고 후속 검토일을 관리합니다.</div>
    <div class="fg" style="grid-template-columns:1fr 1fr"><div class="f"><label>기록 유형</label><select class="in" id="acT">${opt(['교육·홍보','신규 기회','원장 상담','기타'])}</select></div><div class="f"><label>진행 상태</label><select class="in" id="acS">${opt(['검토 예정','진행 중','완료','후속 확인'])}</select></div>
    <div class="f"><label>활동·기회 이름</label><input class="in" id="acN" placeholder="예: 원장님 교육, 신규 프로그램"></div><div class="f"><label>예정일·발생일</label><input class="in" type="date" id="acD"></div>
    <div class="f"><label>담당자</label><input class="in" id="acW" placeholder="담당자 이름"></div><div class="f"><label>다음 검토일</label><input class="in" type="date" id="acX"></div></div>
    <div class="f" style="margin-top:10px"><label>담당 메모·후속 조치</label><textarea class="in" id="acM" placeholder="대상, 진행 결과, 필요한 자료, 다음 행동"></textarea></div>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="saveAct()">활동 저장</button></div></article>
   <article class="card"><h2>예정된 검토</h2>${upcoming.length?`<div class="list">${upcoming.slice(0,10).map(a=>`<div class="it"><span class="badge ${a['내용'].next<D.today?'b-bad':'b-warn'}">${a['내용'].next}</span><div style="flex:1">${esc(a['내용'].name)}<div class="small muted">${esc(a['내용'].type)} · ${esc(a['내용'].who||'')}</div></div></div>`).join('')}</div>`:'<div class="empty">등록된 검토 일정이 없습니다.</div>'}</article>
  </section>
  <section class="card" style="margin-top:16px"><div class="chead"><div style="flex:1"><h2>활동 기록</h2></div><span class="pill n">${acts.length}건</span></div>
   ${acts.length?`<div class="tw"><table class="t"><thead><tr><th>유형</th><th>이름</th><th>날짜</th><th>담당</th><th>상태</th><th>다음 검토</th><th>메모</th><th></th></tr></thead><tbody>${acts.map(a=>{const c=a['내용'];return `<tr><td>${esc(c.type)}</td><td><b>${esc(c.name)}</b></td><td>${c.date||''}</td><td>${esc(c.who||'')}</td><td><select class="in" onchange="updAct('${a.ID}',this.value)">${opt(['검토 예정','진행 중','완료','후속 확인'],c.status)}</select></td><td>${c.next||''}</td><td class="small">${esc(c.memo||'')}</td><td><button class="btn sm red" onclick="delRec('${a.ID}')">삭제</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">등록된 활동·기회가 없습니다.</div>'}</section>`;
}
async function savePlan(){const c={hq:$('#pnH').value,other:$('#pnO').value,basis:$('#pnB').value,vision:$('#pnV').value,plan:$('#pnP').value,ok:$('#pnC').checked,next:$('#pnN').value};if(!c.vision&&!c.plan&&!c.basis)return alert('전망이나 대응 계획을 적어 주세요.');setRecs(await call('saveRecord',[{종류:'전망',기준:$('#pnY').value,내용:c}]));toast('전망을 저장했습니다.');render()}
async function saveAct(){const c={type:$('#acT').value,status:$('#acS').value,name:$('#acN').value.trim(),date:$('#acD').value,who:$('#acW').value,next:$('#acX').value,memo:$('#acM').value};if(!c.name)return alert('이름을 넣어 주세요.');setRecs(await call('saveRecord',[{종류:'활동',기준:c.date||D.today,내용:c}]));toast('활동을 저장했습니다.');render()}
async function updAct(id,st){const r=S.rec.find(x=>x.ID===id);const c={...r['내용'],status:st};setRecs(await call('saveRecord',[{ID:id,종류:'활동',기준:r['기준'],내용:c}]));toast('상태를 바꿨습니다.');render()}
async function delRec(id){if(!confirm('삭제할까요?'))return;setRecs(await call('deleteRecord',[id]));render()}

/* ---------- 설정 ---------- */
function vSet(){
  const st=D.settings, md=st['발행모드']==='실발행', sp=b=>safeJ(st['공급자_'+b]);
  $('#view').innerHTML=`<section class="grid g2">
   <article class="card"><h2>계산서 발행 모드</h2><div class="sub">테스트 모드는 볼타 테스트 환경으로 보내 국세청에 전송되지 않습니다.</div>
    <div class="seg"><button class="${!md?'on':''}" onclick="setMode('테스트')">테스트</button><button class="${md?'on':''}" onclick="setMode('실발행')">실발행</button></div>
    <div class="small" style="margin-top:10px">볼타 키: 실발행 ${D.keys.live?'<span class="badge b-ok">설정됨</span>':'<span class="badge b-bad">없음</span>'} · 테스트 ${D.keys.test?'<span class="badge b-ok">설정됨</span>':'<span class="badge b-bad">없음</span>'}</div>
    <div class="f" style="margin-top:14px"><label>발행관리 시작일 (이 날 이후 입금부터 '발행 대기'에 표시)</label><div class="row"><input class="in" type="date" id="stS" value="${esc(st['발행관리시작일']||'')}"><button class="btn" onclick="setSet('발행관리시작일',$('#stS').value)">저장</button></div></div>
    <div class="f" style="margin-top:14px"><label>비밀번호 바꾸기 (바꾸면 다른 기기는 다시 로그인)</label><div class="row"><input class="in" type="password" id="pwO" placeholder="지금 비밀번호" style="width:140px"><input class="in" type="password" id="pwN" placeholder="새 비밀번호(6자리 이상)" style="width:180px"><button class="btn" onclick="chPin()">변경</button><button class="btn red" onclick="doLogout()">이 기기 로그아웃</button></div></div></article>
   <article class="card"><h2>공급자 정보</h2><div class="sub">계산서에 들어가는 우리 회사 정보입니다.</div>${['중부산동심','부산아이랑'].map(b=>{const s=sp(b);return `<div class="note" style="margin-bottom:8px"><b>${b}</b> · ${esc(s.bno)} · 대표 ${esc(s.rep)}<br><span class="small">${esc(s.addr)} · ${esc(s.email)}</span></div>`}).join('')}
    <h2 style="margin-top:16px">매출관리표 엑셀 저장</h2><div class="small" style="line-height:1.8">매일 밤 23시에 자동으로 드라이브 매출관리표 폴더에 '2026년 중부산 매출관리표 날짜.xlsx'로 저장합니다(같은 날짜는 덮어쓰기). 엑셀은 보기용 사본이고, 수량·추가·반품·입금은 대시보드에서만 고칩니다. 예전 엑셀을 다시 반영할 때도 대시보드에서 고친 줄은 덮어쓰지 않습니다.<br>${(()=>{const x=safeJ(st['마지막엑셀저장']);return x.url?'마지막 저장: '+esc(x.at)+' ('+esc(x.how)+') <a href="'+x.url+'" target="_blank">'+esc(x.name)+'</a>':'아직 저장 기록 없음'})()}</div><button class="btn" style="margin-top:8px" onclick="saveExcel()">지금 엑셀로 저장</button>
    <h2 style="margin-top:16px">데이터</h2><div class="small" style="line-height:1.9">매출 ${S.sales.length.toLocaleString()}줄 · 거래처 ${Object.keys(S.cust).length}곳 · 계산서 ${S.inv.length.toLocaleString()}건 · 입금 기록 ${S.pay.length}건<br>원본 데이터: <a href="${D.sheetUrl}" target="_blank">중부산동심 재무 DB 시트</a> (직접 고치기보다 대시보드에서 고치는 것을 권장)<br>국세청 승인번호는 10분마다 자동으로 확인합니다.</div></article>
  </section>`;
}
async function setMode(m){if(m==='실발행'&&!confirm('실발행으로 바꾸면 발행 버튼을 누를 때 국세청으로 바로 전송됩니다. 바꿀까요?'))return;D.settings=await call('setSetting',['발행모드',m]);reload()}
async function chPin(){const o=$('#pwO').value,n=$('#pwN').value;if(!o||!n)return;await call('changePin',[o,n]);toast('비밀번호를 바꿨습니다.');$('#pwO').value='';$('#pwN').value=''}
async function saveExcel(){if(!confirm('지금 대시보드 매출 자료로 매출관리표 엑셀(.xlsx)을 만들어 드라이브에 저장할까요?\n(같은 날짜 파일은 새 내용으로 바뀝니다)'))return;const r=await call('exportSalesXlsx',[],'엑셀 만드는 중… (30초쯤 걸립니다)');D.settings['마지막엑셀저장']=JSON.stringify(r);$('#mdl').className='modal sm';$('#mdl').innerHTML='<div class="mh"><h3>엑셀 저장 완료</h3></div><div class="okbox">'+esc(r.name)+'<br>폴더: '+esc(r.folder)+' · '+esc(r.at)+'</div><div class="small muted" style="margin-top:8px">'+Object.entries(r.sheets).map(([k,v])=>esc(k)+' '+v+'행').join(' · ')+'</div><div class="note" style="margin-top:10px">보기용 사본입니다. 수량·추가·반품·입금은 대시보드에서만 고쳐 주세요.</div><div class="row" style="justify-content:flex-end;margin-top:12px"><a class="btn pri" href="'+r.url+'" target="_blank">드라이브에서 열기</a><button class="btn" onclick="closeModal()">닫기</button></div>';openModal()}
async function setSet(k,v){D.settings=await call('setSetting',[k,v]);toast('저장했습니다.')}

/* ---------- 모달 ---------- */
function openModal(){$('#mbg').style.display='flex';document.body.style.overflow='hidden'}
function closeModal(){$('#mbg').style.display='none';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

if(TOKEN)reload();else showLogin();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/finance-sw.js',{scope:'/'}).catch(function(){});}</script>
</body>
